name: GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Separa os arquivos publicados
        run: |
          mkdir _site
          cp "web-app-manifest-192x192.png" "Identidade visual.jpg" "avilaops-indexnow-20260730.txt" "site.webmanifest" "sitemap.xml" "image.jpg" "favicon-96x96.png" "app.js" "index.html" "background.avif" "web-app-manifest-512x512.png" "og-default.png" "favicon.svg" "favicon.ico" "image (1).jpg" "apple-touch-icon.png" "image.png" "robots.txt" "Identidade visual - Copia.avif" _site/
          cp -r src _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
